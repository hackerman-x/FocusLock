name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

# ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: focuslock-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/app/build/reports/tests/

  release:
    # Signed release APK, only for version tags (v1.0.0, ...).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signed release APK
        env:
          FOCUSLOCK_KEYSTORE: ${{ runner.temp }}/release.jks
          FOCUSLOCK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FOCUSLOCK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FOCUSLOCK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FOCUSLOCK_VERSION: ${{ github.ref_name }}
          FOCUSLOCK_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: android/FocusLock.apk
